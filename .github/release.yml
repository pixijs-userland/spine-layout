changelog:
    exclude:
        labels:
            - skip-changelog
        authors:
            - github-actions
            - dependabot
    categories:
        - title: 🚨 Breaking Changes
          labels:
              - breaking
        - title: 🎁 Added
          labels:
              - enhancement
        - title: 🐛 Fixed
          labels:
              - bug
        - title: 📝 Documentation
          labels:
              - documentation
        - title: Other Changes
          labels:
              - '*'
