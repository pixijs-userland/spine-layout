name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    packages: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@pixijs-userland'

            - run: pnpm install

            - run: pnpm build

            # pnpm ignores auth tokens in a committed project .npmrc, so set it
            # in pnpm's user-level config where it will be used for publishing.
            - name: Authenticate to GitHub Packages
              run: pnpm config set '//npm.pkg.github.com/:_authToken' "${NODE_AUTH_TOKEN}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The org forbids Actions from opening PRs, so we release directly:
            # consume pending changesets, publish, and push the bump back to main.
            - name: Version, publish, and push
              id: release
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Applies pending changesets: bumps versions, writes CHANGELOG,
                  # and deletes the consumed changeset files.
                  pnpm version-packages

                  if git diff --quiet; then
                      echo "No changesets pending; nothing to release."
                      exit 0
                  fi

                  # Committed before publishing, because `changeset publish` tags whatever
                  # HEAD is when it runs. Published first, the tag named the commit *before*
                  # the bump — pointing at a tree whose package.json still said the old
                  # version. `dist/` is gitignored, so there is nothing here the build adds.
                  git add -A
                  git commit -m "chore: release [skip ci]"

                  # build + changeset publish to GitHub Packages, and tag `vX.Y.Z`
                  pnpm release

                  # --follow-tags, or the tag stays in the runner and dies with it: a plain
                  # push carries commits only. It is what `#semver:` ranges resolve against,
                  # so a release without it is a release nobody can name.
                  git push --follow-tags origin HEAD:main

                  echo "version=$(node -p "require('./package.json').version")" >>"$GITHUB_OUTPUT"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Skipped when the step above found no pending changesets and left `version` unset.
            - name: Publish the GitHub release
              if: steps.release.outputs.version != ''
              run: |
                  # The CHANGELOG section changesets just wrote: everything from the first
                  # `## ` heading down to the next one.
                  awk '/^## /{ n++ } n == 1' CHANGELOG.md >notes.md

                  gh release create "v${VERSION}" \
                      --title "v${VERSION}" \
                      --notes-file notes.md \
                      --verify-tag
              env:
                  VERSION: ${{ steps.release.outputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
