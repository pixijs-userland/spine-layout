name: Release

# Run by hand from the Actions tab: it releases whatever changesets have landed on main since the
# last release. A push to main releases nothing.
on:
    workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
    contents: write
    # npm trusted publishing: npm exchanges this job's OIDC token for a one-off publish
    # token, so the repository holds no NPM_TOKEN.
    id-token: write

jobs:
    release:
        # Trusted publishing only accepts GitHub-hosted runners.
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            # The bump is pushed back to main, so a run dispatched from any other branch would put
            # that branch's tree on main.
            - name: Check the branch
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Run the release from main, not ${GITHUB_REF#refs/heads/}."
                  exit 1

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            # Trusted publishing needs npm 11.5.1 or later.
            - run: npm install -g npm@latest

            - run: pnpm install

            # The org forbids Actions from opening PRs, so we release directly:
            # consume pending changesets, publish, and push the bump back to main.
            - name: Version
              id: version
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Applies pending changesets: bumps versions, writes CHANGELOG,
                  # and deletes the consumed changeset files.
                  pnpm version-packages

                  if git diff --quiet; then
                      echo "::error::No changesets on main since the last release: add one with pnpm changeset."
                      exit 1
                  fi

                  VERSION=$(node -p "require('./package.json').version")

                  # The tag has to name the bump commit: tagged before it, the tag points at a
                  # tree whose package.json still says the old version. Annotated, because
                  # --follow-tags below pushes annotated tags only.
                  git add -A
                  git commit -m "chore: release v${VERSION} [skip ci]"
                  git tag -a "v${VERSION}" -m "v${VERSION}"

                  echo "version=${VERSION}" >>"$GITHUB_OUTPUT"

            - name: Publish to npm
              run: npm publish

            # --follow-tags, or the tag stays in the runner and dies with it: a plain
            # push carries commits only.
            - name: Push the release commit and tag
              run: git push --follow-tags origin HEAD:main

            # The CHANGELOG section changesets just wrote, then GitHub's list of the PRs merged
            # since the previous tag, grouped by label as .github/release.yml says, and the
            # compare link. gh puts --notes-file above the generated notes.
            - name: Publish the GitHub release
              run: |
                  awk '/^## /{ n++; next } n == 1' CHANGELOG.md \
                      | sed -E 's/^- [0-9a-f]{7,}: /- /' >notes.md

                  gh release create "v${VERSION}" \
                      --title "v${VERSION}" \
                      --notes-file notes.md \
                      --generate-notes \
                      --verify-tag
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    docs:
        needs: release
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/deploy-docs.yml
        with:
            ref: v${{ needs.release.outputs.version }}
