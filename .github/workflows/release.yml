name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    packages: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@pixijs-userland'

            - run: pnpm install

            - run: pnpm build

            # pnpm ignores auth tokens in a committed project .npmrc, so set it
            # in pnpm's user-level config where it will be used for publishing.
            - name: Authenticate to GitHub Packages
              run: pnpm config set '//npm.pkg.github.com/:_authToken' "${NODE_AUTH_TOKEN}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The org forbids Actions from opening PRs, so we release directly:
            # consume pending changesets, publish, and push the bump back to main.
            - name: Version, publish, and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Applies pending changesets: bumps versions, writes CHANGELOG,
                  # and deletes the consumed changeset files.
                  pnpm version-packages

                  if git diff --quiet; then
                      echo "No changesets pending; nothing to release."
                      exit 0
                  fi

                  # build + changeset publish to GitHub Packages
                  pnpm release

                  git add -A
                  git commit -m "chore: release [skip ci]"
                  git push origin HEAD:main
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
